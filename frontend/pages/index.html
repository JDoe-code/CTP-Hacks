<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Home</title>
    <link rel="stylesheet" href="../styles/index.css">
  </head>
  <body>
    <h1>Welcome to Simplify!</h1>
    <script src="index.js"></script>
<div class="Simplify">
        <form id="upload">
            <div class="file">
                <label for="input">Upload File:</label>
                <input type="file" id="input" required>
            </div>

            <div class="form-group">
                <label for="rawText">Paste Raw Data:</label>
                <textarea id="rawText" placeholder="Paste your raw data here"></textarea>
            </div>

            <div class="form-group">
                <label for="prompt">Prompt:</label>
                <textarea id="prompt" placeholder="Enter instructions for Gemini"></textarea>
            </div>

            <div class="file">
                <label for="option">Export Format:</label>
                <select id="option">
                    <option value=".csv">.csv</option>
                    <option value=".tsv">.tsv</option>
                    <option value=".json">.json</option>
                    <option value=".parquet">.parquet</option>
                </select>
            </div>

             <div class="form-group">
                <label for="missingStrategy">Missing Values Handling:</label>
                <select id="missingStrategy">
                    <option value="mean">Replace with Mean (Average)</option>
                    <option value="median">Replace with Median</option>
                    <option value="mode">Replace with Mode</option>
                    <option value="drop">Drop Rows with Missing Data</option>
                </select>
            </div>


            <button type="submit" id="submit">Clean Data</button>
        </form>

        <div id="load" class="hidden">Cleaning...</div>
        
        </div>
    </div>
</body>
</html>
