<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Home</title>
    <link rel="stylesheet" href="../styles/index.css">
  </head>
  <body>
    <h1>Hello, world</h1>
    <p>Welcome to Simplify!</p>
    <script src="index.js"></script>
<div class="Simplify">
        <form id="upflie">
            <div class="flie">
                <label for="input">Upload File:</label>
                <input type="file" id="input" required>
            </div>

            <div class="form-gruep">
                <label for="rawText">Paste Raw Data:</label>
                <textarea id="rawText" placeholder="Paste your raw data here"></textarea>
            </div>

            <div class="form-gruep">
                <label for="prompt">Prompt:</label>
                <textarea id="prompt" placeholder="Enter instructions for Gemini"></textarea>
            </div>

            <div class="flie">
                <label for="option">Export Format:</label>
                <select id="option">
                    <option value=".csv">.csv</option>
                    <option value=".tsv">.tsv</option>
                    <option value=".json">.JSON</option>
                    <option value=".parquet">.parquet</option>
                </select>
            </div>

             <div class="form-group">
                <label for="missingStrategy">Missing Values Handling:</label>
                <select id="missingStrategy">
                    <option value="mean">Replace with Mean (Average)</option>
                    <option value="median">Replace with Median</option>
                    <option value="mode">Replace with Mode</option>
                    <option value="drop">Drop Rows with Missing Data</option>
                </select>
            </div>


            <button type="submit" id="submit">Clean Data</button>
        </form>

        <div id="load" class="hidden">Cleaning</div>

        <div id="results" class="hidden">
            <h2>Summary Stats</h2>
            <div id="summarysta"></div>

                   <h2>Data Visualizations</h2>
            <div id="chartsContainer"></div>

            <h2>After Comparison</h2>
            <div class="preview-container">
                <div>
                    <h3>Original Raw Data</h3>
                    <pre id="beforePreview"></pre>
                </div>
                <div>
                    <h3>Cleaned Output Data</h3>
                    <pre id="afterPreview"></pre>
                </div>
        </div>
    </div>
</body>
</html>
